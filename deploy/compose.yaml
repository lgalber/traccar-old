# Traccar (built from this fork) + PostgreSQL.
# DB_PASSWORD comes from the .env file next to this file on the server (created by deploy.sh).

services:

  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    volumes:
      - /opt/traccar/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traccar -d traccar"]
      interval: 10s
      timeout: 5s
      retries: 10

  traccar:
    build: .
    image: traccar-custom:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${DB_PASSWORD}
      # Acknowledge every H02 message (ST-901 sends V8, which is not acked by default);
      # without it the tracker resends each position and replays old ones.
      H02_ACK: "true"
      # GPS drift while parked (e.g. indoors): keep the last known coordinates when the
      # position moves less than 50 m or has no valid fix. Positions and alarms are kept;
      # only coordinates are corrected. (filter.invalid is avoided on purpose: it would
      # drop alarm messages that arrive without a fix.)
      COORDINATES_FILTER: "true"
      COORDINATES_MIN_ERROR: "50"
      COORDINATES_FILTER_INVALID: "true"
      # Count as moving only above ~5 km/h (value in knots; default 0.01)
      EVENT_MOTION_SPEED_THRESHOLD: "2.7"
      # Stay logged in: 30-day login cookie (kept by phones and home-screen apps) and logins stored
      # in the database so restarts and deploys do not log everyone out
      WEB_SESSION_TIMEOUT: "2592000"
      WEB_PERSIST_SESSION: "true"
      # Public address (links in notifications and emails)
      WEB_URL: ${WEB_URL:-}
      # Notification channels; webpush = browser/phone notifications (fork feature)
      NOTIFICATOR_TYPES: "web,mail,command,webpush"
      NOTIFICATOR_WEBPUSH_PUBLIC_KEY: ${WEBPUSH_PUBLIC_KEY:-}
      NOTIFICATOR_WEBPUSH_PRIVATE_KEY: ${WEBPUSH_PRIVATE_KEY:-}
      NOTIFICATOR_WEBPUSH_SUBJECT: ${WEBPUSH_SUBJECT:-}
      # Email through Gmail SMTP (app password in .env; empty values leave mail unconfigured)
      MAIL_SMTP_HOST: smtp.gmail.com
      MAIL_SMTP_PORT: "587"
      MAIL_SMTP_STARTTLS_ENABLE: "true"
      MAIL_SMTP_STARTTLS_REQUIRED: "true"
      MAIL_SMTP_USERNAME: ${SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_SMTP_FROM: ${SMTP_USERNAME:-}
      MAIL_SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Traccar}
      # Gmail can take more than the 5 s default to answer; avoid dropped alarm emails
      MAIL_SMTP_TIMEOUT: "30000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/health"]
      interval: 2m
      timeout: 5s
      start_period: 5m
      retries: 3
    ports:
      - "8082:8082"       # web UI + REST API
      - "5013:5013/tcp"   # H02 protocol (SinoTrack ST-901)
      - "5013:5013/udp"
    volumes:
      - /opt/traccar/logs:/opt/traccar/logs
      # Uploaded device icons/images and device media; must survive container recreation
      - /opt/traccar/media:/opt/traccar/media

  # Dynamic DNS: keeps a DNS-only Cloudflare record (e.g. gps.example.com) pointed at the host's public IP,
  # so trackers can connect by name and survive public IP changes. Enabled with COMPOSE_PROFILES=ddns in .env,
  # together with CF_API_TOKEN (Cloudflare token limited to "Edit zone DNS") and DDNS_DOMAINS.
  ddns:
    image: favonia/cloudflare-ddns:1
    profiles: ["ddns"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [all]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_API_TOKEN:-}
      DOMAINS: ${DDNS_DOMAINS:-}
      PROXIED: "false"
      IP6_PROVIDER: none
      UPDATE_CRON: "@every 5m"
